<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Teste Crop</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; }
    .crop-container { position: relative; width: 400px; height: 300px; border: 1px solid #ccc; margin-bottom: 10px; overflow: hidden; }
    canvas { width: 100%; height: 100%; }
    input[type="range"] { width: 100%; }
  </style>
</head>
<body>

<h2>Teste Crop em Tempo Real</h2>

<input type="file" id="fileInput" accept="image/*" /><br><br>

<div class="crop-container">
  <canvas id="cropCanvas" width="400" height="300"></canvas>
</div>

<label>Zoom:</label>
<input type="range" id="zoomRange" min="1" max="3" step="0.01" value="1" /><br><br>

<button id="downloadBtn">Baixar Crop</button>

<script>
const fileInput = document.getElementById('fileInput');
const canvas = document.getElementById('cropCanvas');
const ctx = canvas.getContext('2d');
const zoomRange = document.getElementById('zoomRange');
const downloadBtn = document.getElementById('downloadBtn');

let image = null;
let zoom = 1;
let offsetX = 0;
let offsetY = 0;
let isDragging = false;
let startX = 0;
let startY = 0;

// Carregar imagem
fileInput.addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = () => {
    image = new Image();
    image.src = reader.result;
    image.onload = draw;
  };
  reader.readAsDataURL(file);
});

// Zoom
zoomRange.addEventListener('input', e => {
  zoom = parseFloat(e.target.value);
  draw();
});

// Drag para mover crop
canvas.addEventListener('mousedown', e => {
  isDragging = true;
  startX = e.offsetX - offsetX;
  startY = e.offsetY - offsetY;
});
canvas.addEventListener('mouseup', () => isDragging = false);
canvas.addEventListener('mouseleave', () => isDragging = false);
canvas.addEventListener('mousemove', e => {
  if (!isDragging) return;
  offsetX = e.offsetX - startX;
  offsetY = e.offsetY - startY;
  draw();
});

// Desenhar crop
function draw() {
  if (!image) return;

  ctx.fillStyle = "#ffffff";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  const w = image.width;
  const h = image.height;
  const x = offsetX;
  const y = offsetY;

  ctx.drawImage(image, -x, -y, w / zoom, h / zoom, 0, 0, canvas.width, canvas.height);
}

// Baixar imagem
downloadBtn.addEventListener('click', () => {
  if (!image) return;

  canvas.toBlob(blob => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'cropped.png';
    a.click();
  }, 'image/png');
});
</script>

</body>
</html>
